# ============================================
#  Информация об игроке (FlameCore) — /info
#  Отправляется в Telegram-бота после /info <ник>
#  Плейсхолдеры заменяются автоматически.
# ============================================
playerinfo:
  tg-menu: |
    ИНФОРМАЦИЯ ОБ ИГРОКЕ <b>%player%</b>

    Выберите интересующий вас раздел кнопкой ниже.

  tg-basic: |
    <b>ℹ ОСНОВНАЯ ИНФОРМАЦИЯ — %player%</b>

    🎮 Ник: <code>%player%</code>
    🆔 UUID: <code>%uuid%</code>
    🌐 Реальный IP: <code>%ip%</code>
    📍 Страна / город: %geo%
    🗓 Первый вход: %first%
    📅 Последний вход: %last%
    ⏱ Общее время онлайн: %total%
    📶 Статус: %status%

  tg-game: |
    <b>🎮 ИГРОВАЯ ИНФОРМАЦИЯ — %player%</b>

    🌍 Мир: %world%
    📍 Координаты: X %x% · Y %y% · Z %z%
    🎮 Режим: %gamemode%
    ⭐ Уровень опыта: %level%
    ❤️ Здоровье: %health%
    🍗 Голод: %hunger%

  tg-mod: |
    <b>🛡 МОДЕРАЦИЯ — %player%</b>

    🔇 Активные муты: %muted%
    🕓 История IP: %ips%
