# ============================================
#  Конфигурация плагина FlameCore
#  Управляющий модуль сервера FlameDex
# ============================================

# --- База данных ---
database:
  type: "h2"
  file: "flamecore"

# --- Telegram бот ---
bot:
  token: "ВАШ_ТОКЕН_БОТА"

# --- Главный администратор (владелец) ---
owner:
  # Ник главного администратора
  name: "jonycape"
  # Telegram ID владельца (кому приходят уведомления о входе владельца)
  telegram_id: "000000000"

# --- Администраторы (ник → его Telegram ID) ---
# Каждому администратору бот отправляет уведомление о его входе прямо в личку.
# Узнать свой Telegram ID можно у бота @userinfobot (отправьте ему /start).
admins:
  admin1: "111111111"
  admin2: "222222222"
  admin3: "333333333"

# --- Двойное подтверждение опасных команд ---
# Команды, дающие "фулл-доступ", не выполняются сразу: подтверждение уходит админу,
# владельцу — уведомление с кнопкой "Отклонить". Если владелец не отклонит за указанное
# время — команда выполняется сама. Если отклонит — игрок получает вечный бан.
# Маски — регулярные выражения (соответствие команде без ведущего "/").
protection:
  # Время ожидания подтверждения входа админа (сек). По истечении игрок размораживается.
  login-timeout: 90

  # Время ожидания подтверждения опасной команды в секундах (150 = 2,5 минуты)
  confirm-timeout: 150

  # Маски опасных команд (выдача фулл-доступа / критичные действия)
  # ВАЖНО: команды бана сюда НЕ включаются — модераторы багют игроков без подтверждения.
  dangerous-commands:
    - "^(op|deop)\\b.*"
    - "^(permission|luckperms|lp)\\b.*"
    - "^(pex|permissionsex)\\b.*"
    - "\\*\\s*(add|set|grant|parent)\\b.*"
    - "^(whitelist)\\s+off\\b.*"
    - "^(stop|restart)\\b.*"

# --- Сообщения Telegram-бота ---
# Текст сообщений, которые бот отправляет в Telegram. Поддерживаются HTML-теги
# (<b>, <code>, <blockquote> для цитат) и плейсхолдеры: %player%, %ip%, %time%, %command%, %timeout%.
telegram-messages:
  admin-login:
    - "🔐 <b>Запрос входа АДМИНИСТРАТОРА</b>"
    - ""
    - "👤 Ник: <b>%player%</b>"
    - "🌐 IP: %ip%"
    - "🕐 Время: %time%"

  owner-login:
    - "👑 <b>ВЛАДЕЛЕЦ</b> запрашивает вход"
    - ""
    - "👤 Ник: <b>%player%</b>"
    - "🌐 IP: %ip%"
    - "🕐 Время: %time%"

  danger-sender:
    - "⚠️ <b>ОПАСНАЯ КОМАНДА</b>"
    - ""
    - "👤 Ты (админ) отправил команду:"
    - ""
    - "<blockquote><code>%command%</code></blockquote>"
    - ""
    - "Она <b>не выполняется</b> сразу. Владелец получил уведомление."
    - "Если за %timeout% сек от неё не откажутся — она выполнится сама."
    - ""
    - "🕐 Время: %time%"

  danger-owner:
    - "🚨 <b>ИСПОЛЬЗОВАНИЕ ВРЕДОНОСНОЙ КОМАНДЫ</b>"
    - ""
    - "👤 Администратор <b>%player%</b> отправил команду:"
    - "<code>%command%</code>"
    - ""
    - "<blockquote>Если аккаунт взломан или это попытка краша сервера — нажми «Отклонить»:"
    - "⚠️ После этого игрок будет <b>забанен навсегда</b>.</blockquote>"
    - ""
    - "🕐 Время: <b>%time%</b>"

  danger-executed:
    - "✅ Команда <b>%player%</b> выполнилась автоматически (таймаут истёк):"
    - "<code>%command%</code>"

# --- Промокоды ---
# Игрок пишет в чат "/<название>" и получает награду.
# uses: сколько раз КАЖДЫЙ игрок может активировать промокод (по 1 = один раз).
# commands: команды, которые выполнит консоль от имени %player%.
# colors / fade: цвета частиц фейерверка (HEX без "#", минимум 1).
promo-codes:
  example:
    uses: 1
    colors: [ "ff8800", "ff0000" ]
    fade: [ "ffdd55", "7a0000" ]
    commands:
      - "give %player% diamond 1"
      - "broadcast &6%player% &eактивировал промокод!"

# --- Кастомизация для админов (flamecore.customize) ---
# Цвета свечения (GLOW), попугай на плече, нимб частиц над головой.
# task-interval: базовая частота тика (меньше = плавнее, но больше нагрузка).
# *-interval: период для каждого эффекта в тиках. 0 = выключить эффект.
# nimb-radius: радиус кольца нимба. nimb-particles: число частиц в кольце.
customize:
  task-interval: 2
  glow-interval: 10
  nimb-interval: 5
  nimb-radius: 0.5
  nimb-particles: 8

# --- Стримеры (flamecore.stream) ---
# /flamecore stream <url> — анонс стрима на весь сервер.
stream:
  # Пауза между анонсами одного стримера в секундах.
  cooldown: 120

# --- Сообщения плагина ---
# Многострочные сообщения записываются списком (каждая строка с "- ").
# Единый стиль: первая строка пустая, затем заголовок, затем тело через "  &7 > &f...".
# Плейсхолдеры: %player%, %id%, %prize%, %time%, %winner%, %tps1%, %mspt% и т.д.
# Поддерживаются HEX-цвета вида &#RRGGBB (например &#ff6b6b) и обычные коды (&a, &l, &o...).
