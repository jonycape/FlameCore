# ============================================
#  Конфигурация плагина FlameCore
#  Управляющий модуль сервера FlameDex
# ============================================
#
#  В config.yml — только самые важные настройки
#  (база данных, Telegram-бот и владелец).
#  Остальное разбито по файлам:
#    admin-guard.yml  — защита администратора (admins, protection, telegram-messages)
#    messages.yml     — все игровые сообщения плагина
#    customize.yml    — кастомизация (свечение, попугай, нимб)
#    stream.yml       — стримеры
#    promo-codes.yml  — промокоды
#    donatetop.yml    — топ по платежам (NPC + голограмма)

# --- База данных ---
database:
  type: "h2"
  file: "flamecore"

# --- Telegram бот ---
bot:
  token: "ВАШ_ТОКЕН_БОТА"

# --- Главный администратор (владелец) ---
owner:
  # Ник главного администратора
  name: "jonycape"
  # Telegram ID владельца (кому приходят уведомления о входе владельца)
  telegram_id: "000000000"
