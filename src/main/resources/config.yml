# ============================================
#  Конфигурация плагина FlameCore
#  Управляющий модуль сервера FlameDex
# ============================================
#
#  В config.yml — только самые важные настройки
#  (база данных, Telegram-бот и владелец).
#  Остальное разбито по файлам:
#    admin-guard.yml  — защита администратора (admins, protection, telegram-messages)
#    messages.yml     — все игровые сообщения плагина
#    customize.yml    — кастомизация (свечение, попугай, нимб)
#    stream.yml       — стримеры
#    promo-codes.yml  — промокоды
#    donatetop.yml    — топ по платежам (NPC + голограмма)

# --- Модули (каждая фича включается/выключается отдельно) ---
modules:
  # Защита входа админов/владельца через Telegram + защита опасных команд
  protection: true
  # Конкурсы /giveaway
  giveaway: true
  # Промокоды
  promocode: true
  # Кастомизация админов (свечение, попугай, нимб)
  customize: true
  # Анонсы стримов
  stream: true
  # Топ по платежам (NPC + голограмма, нужен DecentHolograms)
  donatetop: true
  # Информация об игроке в Telegram (/info). Сбор статистики (первый/последний вход,
  # время онлайн, история IP) работает всегда, независимо от этого модуля.
  playerinfo: true
  # Оповещение о покупке (/flamecore donate, из консоли/сайта)
  donate: true

# --- База данных ---
database:
  type: "h2"
  file: "flamecore"

# --- Telegram бот ---
bot:
  token: "ВАШ_ТОКЕН_БОТА"

# --- Главный администратор (владелец) ---
owner:
  # Ник главного администратора
  name: "jonycape"
  # Telegram ID владельца (кому приходят уведомления о входе владельца)
  telegram_id: "000000000"
