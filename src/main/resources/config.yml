# ============================================
#  Конфигурация плагина FlameCore
#  Управляющий модуль сервера FlameDex
# ============================================

# --- База данных ---
database:
  type: "h2"
  file: "flamecore"

# --- Telegram бот ---
bot:
  token: "ВАШ_ТОКЕН_БОТА"

# --- Главный администратор (владелец) ---
owner:
  # Ник главного администратора
  name: "jonycape"
  # Telegram ID владельца (кому приходят уведомления)
  telegram_id: "000000000"

# --- Администраторы (их может быть сколько угодно) ---
admins:
  - "admin1"
  - "admin2"
  - "admin3"

# --- Сообщения плагина ---
# Многострочные сообщения записываются списком (каждая строка с "- ").
# Плейсхолдеры: %player%, %id%, %prize%, %time%, %winner%, %tps1%, %mspt% и т.д.
# Поддерживаются HEX-цвета вида &#RRGGBB (например &#ff6b6b) и обычные коды (&a, &l, &o...).
messages:
  prefix:
    - "&#ff6b6b&lFlameCore &7» &f"

  no-permission:
    - "&c✖ У вас недостаточно прав для этого действия."

  unknown-command:
    - "&c✖ Неизвестная команда."
    - "&7  Воспользуйтесь &b/flamecore &7для справки."

  panel-locked:
    - "&c✖ Панель управления сервером заблокирована."
    - "&7  Подтвердите вход через Telegram, нажав кнопку &a«Выдать доступ»&7."

  # --- Защита администратора ---
  admin-approved:
    - ""
    - "&a&l✓ ВХОД ПОДТВЕРЖДЁН"
    - "&7═&e═&6═&e═&7═&e═&6═&e═&7═&e═&6═&e═&7═&e═&6═&e═&7═"
    - "&fДобро пожаловать обратно, &6&l%player%&f!"
    - "&7Сервер, которым ты управляешь, ждал тебя."
    - "&7═&e═&6═&e═&7═&e═&6═&e═&7═&e═&6═&e═&7═&e═&6═&e═&7═"

  admin-denied:
    - ""
    - "&c&l✕ ВХОД ОТКЛОНЁН"
    - "&cВаш вход не был подтверждён."
    - "&7Доступ запрещён администратором через Telegram."
    - ""

  admin-waiting:
    - ""
    - "&#ffd166&l⏳ ОЖИДАНИЕ ПОДТВЕРЖДЕНИЯ"
    - "&8────────────────────────────────"
    - "&fЧтобы войти, подтвердите вход через Telegram-бота."
    - "&7Пока вход не подтверждён, вы не можете двигаться и действовать."
    - "&8────────────────────────────────"
    - ""

  owner-panel-granted:
    - ""
    - "&#46e58b&l✔ ДОСТУП К ПАНЕЛИ ВЫДАН"
    - "&8──────────────────────"
    - "&fТеперь вам доступны команды:"
    - "  &e/flamecore &7tps &f· mspt &f· system"
    - "  &e/flamecore &7online &7 · &fworlds"
    - "  &e/flamecore &7announce · &fplayer · check"
    - ""

  owner-panel-denied:
    - "&c✗ Доступ к панели не выдан."

  # --- Конкурсы ---
  giveaway-create-usage:
    - "&cНеверное использование команды."
    - "&eПравильно: &a/giveaway create <приз> <время>"
    - "&7Пример: &a/giveaway create VIP-статус 15m"

  giveaway-join-usage:
    - "&cНеверное использование команды."
    - "&eПравильно: &a/giveaway join <id>"

  giveaway-invalid-time:
    - "&cНеверный формат времени."
    - "&7Примеры: &e15m&7, &e1h&7, &e2d&7."

  giveaway-created:
    - "&e&lНОВЫЙ КОНКУРС"
    - "&7────────────────────────"
    - "&6Приз: &f%prize%"
    - "&6Идентификатор: &f%id%"
    - "&6Время окончания: &f%time%"
    - "&7────────────────────────"
    - "&fУчаствуй: &e/giveaway join %id%"

  giveaway-not-found:
    - "&cКонкурс с ID &e%id% &cне найден."
    - "&7Возможно, он уже завершён."

  giveaway-already-joined:
    - "&cВы уже участвуете в конкурсе &e%id%&c."

  giveaway-join-success:
    - "&aВы успешно участвуете в конкурсе &e%id%&a!"
    - "&7Удачи!"

  giveaway-console-only:
    - "&cЭта команда доступна только игрокам."

  giveaway-no-participants:
    - "&eКонкурс &6%id% &e(приз: &6%prize%&e) завершён!"
    - "&cВ конкурсе не было участников, победитель не выбран."

  giveaway-winner:
    - "&e&lРЕЗУЛЬТАТЫ КОНКУРСА"
    - "&7-------------------------------------"
    - "&6Приз: &f%prize%"
    - "&6Идентификатор: &f%id%"
    - "&6Победитель: &a&l%winner%"
    - "&aПоздравляем победителя!"

  # --- Команды управления сервером ---
  management-info:
    - "&6&lFlameCore &7— управление сервером"
    - "&7=================================="
    - "&fКоманды владельца:"
    - "&f  &e/flamecore tps"
    - "&f  &e/flamecore mspt"
    - "&f  &e/flamecore system"
    - "&f  &e/flamecore online"
    - "&f  &e/flamecore worlds"
    - "&f  &e/flamecore announce <сообщение>"
    - "&f  &e/flamecore player <ник>"
    - "&f  &e/flamecore check"
    - "&f  &e/flamecore reload"

  management-usage:
    - "&cНеверные аргументы. Проверьте справку: &e/flamecore"

  management-tps:
    - "&e&lTPS сервера"
    - "&7За 1 минуту: &f%tps1%"
    - "&7За 5 минут: &f%tps5%"
    - "&7За 15 минут: &f%tps15%"

  management-mspt:
    - "&e&lMSPT сервера"
    - "&7Среднее время тика: &f%mspt% &7ms"

  management-system:
    - "&e&lНагрузка на систему"
    - "&7ОС: &f%os%"
    - "&7Ядер: &f%cores%"
    - "&7Нагрузка CPU: &f%cpu%"
    - "&7Память (используется): &f%mem%"

  management-online:
    - "&e&lОнлайн сервера"
    - "&7Игроков онлайн: &f%online%"

  management-worlds:
    - "&e&lОнлайн по мирам"

  management-player:
    - "&e&lИнформация об игроке"
    - "&7──────────────────────"
    - "&7Ник: &f%player%"
    - "&7Привилегия: &f%prefix%"
    - "&7IP: &f%ip%"
    - "&7Мир: &f%world%"
    - "&7Пинг: &f%ping% ms"
    - "&7Режим: &f%gamemode%"

  management-player-not-found:
    - "&cИгрок &e%player% &cне найден или не в сети."

  management-check:
    - "&e&lПроверка систем плагина"
    - "&7──────────────────────"
    - "&7Версия плагина: &f%version%"
    - "&7База данных H2: %db%"
    - "&7Telegram бот: %telegram%"
    - "&7Онлайн: &f%online%"
    - "&7Время работы: &f%uptime%"

  management-reload:
    - "&aКонфигурация и подсистемы перезагружены."