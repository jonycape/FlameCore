# ============================================
#  Кастомизация для админов (flamecore.customize)
# ============================================
# Цвета свечения (GLOW) вокруг игрока.
# task-interval: базовая частота тика (меньше = плавнее, но больше нагрузка).
# glow-interval: период обновления радужного свечения в тиках.
customize:
  task-interval: 2
  glow-interval: 10
